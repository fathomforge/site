<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Fraunces'; font-style: normal; font-weight: 100 900;
    src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2') format('woff2-variations');
  }
  @font-face {
    font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800;
    src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations');
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #090C11;
    color: #E8E6E1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
    font-family: 'JetBrains Mono', monospace;
  }
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(760px 460px at 88% -6%, rgba(240,169,59,.16), transparent 62%),
      radial-gradient(900px 600px at 4% 104%, rgba(70,120,200,.11), transparent 60%);
  }
  .rule { position: absolute; left: 0; right: 0; height: 1px; background: rgba(232,230,225,.09); }
  .rule.t { top: 128px; } .rule.b { bottom: 128px; }

  header { display: flex; align-items: center; gap: 14px; position: relative; }
  .mark { width: 30px; height: 30px; color: #F0A93B; }
  .word { font-size: 25px; letter-spacing: -.01em; }
  .kicker {
    margin-left: auto; font-size: 15px; letter-spacing: .18em;
    text-transform: uppercase; color: #738093;
  }

  main { position: relative; max-width: 940px; }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400; letter-spacing: -.022em; line-height: 1.08;
    text-wrap: balance;
  }
  /* Long titles step down so they never overflow the card. */
  h1.s  { font-size: 80px; }
  h1.m  { font-size: 68px; }
  h1.l  { font-size: 56px; }
  h1.xl { font-size: 46px; }
  .desc {
    margin-top: 26px; font-size: 22px; line-height: 1.5;
    color: #93A0B4; max-width: 830px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
  }

  footer {
    display: flex; align-items: flex-end; justify-content: space-between;
    position: relative; gap: 32px;
  }
  .domain { font-size: 19px; color: #F0A93B; letter-spacing: .02em; }
  .spark { width: 260px; height: 66px; flex: none; }
</style>
</head>
<body>
  <div class="glow"></div><div class="rule t"></div><div class="rule b"></div>

  <header>
    <svg class="mark" viewBox="0 0 24 24" fill="none">
      <path d="M3 7h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3.5" opacity=".55"/>
      <path d="M3 20c5-.5 8.5-2.5 11-5.5 1.7-2 3.1-3.5 4.8-3.5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="word">fathomforge</span>
    <span class="kicker" id="kicker"></span>
  </header>

  <main>
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </main>

  <footer>
    <span class="domain">fathomforge.dev</span>
    <!-- The house motif: a run caught at the cap. -->
    <svg class="spark" viewBox="0 0 260 66" fill="none">
      <line x1="0" y1="22" x2="260" y2="22" stroke="#F0A93B" stroke-width="1.2"
            stroke-dasharray="4 5" opacity=".55"/>
      <path d="M2,60 C70,58 108,52 140,40 C168,30 186,26 206,26 L258,26"
            stroke="#F0A93B" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M140,40 C170,28 196,12 218,2"
            stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity=".85"/>
      <circle cx="206" cy="26" r="4" fill="#090C11" stroke="#F0A93B" stroke-width="2"/>
    </svg>
  </footer>

<script>
  const q = new URLSearchParams(location.search);
  const title  = q.get('title')  || 'Security engineering for autonomous systems';
  const desc   = q.get('desc')   || '';
  const kicker = q.get('kicker') || '';

  document.getElementById('kicker').textContent = kicker;
  document.getElementById('desc').textContent = desc;

  const h = document.getElementById('title');
  h.textContent = title;
  // Pick the largest size class that still fits the card's text block.
  const n = title.length;
  h.className = n <= 26 ? 's' : n <= 44 ? 'm' : n <= 72 ? 'l' : 'xl';
  if (!desc) document.getElementById('desc').style.display = 'none';
</script>
</body>
</html>
